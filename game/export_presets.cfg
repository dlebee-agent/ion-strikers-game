; Export presets for Ion Strikers.
;
; Versioned so the release workflow can export without an editor session. Only
; values that differ from the platform defaults are listed; Godot fills the rest
; in when it loads a preset.
;
; Client presets ship the usual executable + .pck pair. Server presets embed the
; pack so a deployment is a single file, and keep a console binary on Windows so
; the headless process can actually write to stdout.
;
; The macOS presets are universal, and Godot refuses a universal or arm64 export
; unless ETC2 ASTC is enabled both here and in project.godot.
;
; The macOS presets leave codesigning and notarization disabled on purpose: the
; workflow signs, notarizes and staples the bundles itself so it can also sign
; the DMG wrapper. application/version is a placeholder that the workflow
; rewrites from the release tag.

[preset.0]

name="Linux Client"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

